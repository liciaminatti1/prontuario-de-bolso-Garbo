<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prontuário de Bolso</title>
  <meta name="description" content="Fichas clínicas de raciocínio rápido para UBS e Pronto-Socorro.">
  <meta name="theme-color" content="#0b6e55">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Prontuário de Bolso <small>Raciocínio rápido · UBS e Pronto-Socorro</small></h1>
      </div>
      <div class="paths" role="group" aria-label="Caminho de atendimento">
        <button class="path" data-p="todos" aria-pressed="true" id="p-todos"><i class="dot"></i>Todos</button>
        <button class="path" data-p="ubs" aria-pressed="false" id="p-ubs"><i class="dot"></i>UBS / APS</button>
        <button class="path" data-p="ps" aria-pressed="false" id="p-ps"><i class="dot"></i>PS / Emergência</button>
      </div>
      <div class="esp" id="esp" role="group" aria-label="Especialidade"></div>
      <input class="search" id="q" type="search" placeholder="Buscar queixa, diagnóstico ou droga (ex.: dor torácica, adrenalina)" autocomplete="off">
    </div>
  </header>

  <main class="wrap" id="app"><p class="empty">Carregando fichas…</p></main>

  <!-- 1. Registro (precisa vir antes das fichas) -->
  <script src="js/registro.js"></script>

  <!-- 2. Fichas: geradas por "node ferramentas/gerar-indice.js". Não edite à mão entre os marcadores. -->
  <!-- FICHAS:INICIO -->
  <!-- Cardiologia -->
  <script src="fichas/cardiologia/dislipidemia.js"></script>
  <script src="fichas/cardiologia/dor-toracica-ubs.js"></script>
  <script src="fichas/cardiologia/fibrilacao-atrial.js"></script>
  <script src="fichas/cardiologia/has-emerg.js"></script>
  <script src="fichas/cardiologia/has-ubs.js"></script>
  <script src="fichas/cardiologia/ic-descompensada.js"></script>
  <script src="fichas/cardiologia/sca.js"></script>
  <!-- Pneumologia -->
  <script src="fichas/pneumologia/asma-ps.js"></script>
  <script src="fichas/pneumologia/asma-ubs.js"></script>
  <script src="fichas/pneumologia/dpoc.js"></script>
  <script src="fichas/pneumologia/pneumonia.js"></script>
  <script src="fichas/pneumologia/tep.js"></script>
  <!-- Neurologia -->
  <script src="fichas/neurologia/avc.js"></script>
  <script src="fichas/neurologia/cefaleia-ps.js"></script>
  <script src="fichas/neurologia/convulsao.js"></script>
  <script src="fichas/neurologia/enxaqueca.js"></script>
  <!-- Infectologia -->
  <script src="fichas/infectologia/cistite.js"></script>
  <script src="fichas/infectologia/dengue.js"></script>
  <script src="fichas/infectologia/ivas-sinusite.js"></script>
  <script src="fichas/infectologia/sepse.js"></script>
  <!-- Endócrino e metabólico -->
  <script src="fichas/endocrinologia/cetoacidose.js"></script>
  <script src="fichas/endocrinologia/diabetes-tipo-2.js"></script>
  <script src="fichas/endocrinologia/hipercalemia.js"></script>
  <script src="fichas/endocrinologia/hipoglicemia.js"></script>
  <script src="fichas/endocrinologia/hipotireoidismo.js"></script>
  <!-- Pediatria -->
  <script src="fichas/pediatria/bronquiolite.js"></script>
  <script src="fichas/pediatria/diarreia-desidratacao.js"></script>
  <script src="fichas/pediatria/febre-lactente.js"></script>
  <script src="fichas/pediatria/otite-media.js"></script>
  <!-- Dermatologia -->
  <script src="fichas/dermatologia/celulite-erisipela.js"></script>
  <script src="fichas/dermatologia/escabiose.js"></script>
  <!-- Saúde mental -->
  <script src="fichas/saude-mental/depressao-ansiedade.js"></script>
  <!-- Musculoesquelético -->
  <script src="fichas/musculoesqueletico/lombalgia.js"></script>
  <!-- Trauma -->

  <!-- 3. Aplicação -->

</html>
